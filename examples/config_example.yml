# Exemple de configuration IziProxy
# Emplacements recherchés : ./iziproxy.yml, ~/.config/iziproxy.yml, ~/.iziproxy.yml

environments:
  local:
    # Pas de proxy_url : détection automatique (variables, système, PAC)
    requires_auth: true
    auth_type: ntlm              # poste Windows : session courante via SSPI

  dev:
    proxy_url: "http://dev-proxy.example.com:8080"
    requires_auth: true
    auth_type: basic
    no_proxy: "*.dev.example.com,10.0.0.0/8"

  prod:
    pac_url: "http://pac.example.com/proxy.pac"
    requires_auth: false          # omis : détecté en interrogeant le proxy

# Exclusions communes à tous les environnements
no_proxy: "<local>,*.internal.example.com"

environment_detection:
  method: auto                    # auto, env_var (IZIPROXY_ENV), hostname, ip, ask
  hostname_patterns:
    dev: ["-dev", "staging"]
    prod: ["-prod"]
  hostname_regex:
    prod: ['^prd\d+-']
  ip_ranges:
    dev: ["10.0.0.0/16"]
    prod: ["172.16.0.0/16", "192.168.10.1-192.168.10.50"]

system_proxy:
  use_system_proxy: true
  detect_env_vars: true
  detect_pac: true                # nécessite pip install iziproxy[pac]

# Certificats du proxy https:// et du fichier PAC : true (autorités du
# système, recommandé avec pip install iziproxy[truststore]), false, ou chemin
verify: true

credentials:
  prompt: true                    # false pour ne jamais demander (serveurs, CI)
