[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "iziproxy"
version = "0.7.0"
description = "Une bibliothèque Python pour la gestion simplifiée des proxys d'entreprise"
readme = "README.md"
authors = [
    {name = "sanjuant"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["proxy", "enterprise", "authentication", "ntlm", "requests", "configuration", "development",  "pac"]
# Dernières versions publiées (novembre 2026) : les versions antérieures de
# requests, urllib3, cryptography et aiohttp ont des failles connues, dont
# des fuites de l'en-tête Proxy-Authorization
dependencies = [
    "requests>=2.34.2",
    "PyYAML>=6.0.3",
    "keyring>=25.7.0",
    "cryptography>=50.0.2",
    "urllib3>=2.8.0",
]
# requests 2.34 et urllib3 2.8 exigent Python 3.10
requires-python = ">=3.10"

[project.optional-dependencies]
ntlm = [
    "pyspnego>=0.12.4",
]
pac = [
    "pypac>=0.19.0",
]
truststore = [
    "truststore>=0.10.5",
]
httpx = [
    "httpx>=0.28.1",
]
aiohttp = [
    "aiohttp>=3.14.5",
]
all = [
    "pyspnego>=0.12.4",
    "pypac>=0.19.0",
    "truststore>=0.10.5",
]
# Outils : minimum = dernière version compatible avec Python 3.10 ; pip
# installe la toute dernière sur un Python plus récent (websockets 17.4,
# flake8 7.5 : Python 3.11+ ; Sphinx 9.2 : Python 3.13+)
dev = [
    "pyspnego>=0.12.4",
    "pypac>=0.19.0",
    "truststore>=0.10.5",
    "httpx>=0.28.1",
    "aiohttp>=3.14.5",
    "websockets>=16.1.1",
    "grpcio>=1.85.1",
    "selenium>=4.52.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "flake8>=7.4.1",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.1.0",
]

[project.urls]
"Homepage" = "https://github.com/sanjuant/iziproxy"
"Bug Tracker" = "https://github.com/sanjuant/iziproxy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"