[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iziproxy"
version = "0.7.0"
description = "Une bibliothèque Python pour la gestion simplifiée des proxys d'entreprise"
readme = "README.md"
authors = [
    {name = "sanjuant"}
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["proxy", "enterprise", "authentication", "ntlm", "requests", "configuration", "development",  "pac"]
dependencies = [
    "requests>=2.25.0",
    "PyYAML>=6.0",
    "keyring>=23.0.0",
    "cryptography>=36.0.0",
    "urllib3>=1.26",
]
requires-python = ">=3.8"

[project.optional-dependencies]
ntlm = [
    "pyspnego>=0.9.0",
]
pac = [
    "pypac>=0.16.0",
]
truststore = [
    "truststore>=0.10.0; python_version >= '3.10'",
]
httpx = [
    "httpx>=0.26.0",
]
aiohttp = [
    "aiohttp>=3.11.0",
]
all = [
    "pyspnego>=0.9.0",
    "pypac>=0.16.0",
    "truststore>=0.10.0; python_version >= '3.10'",
]
dev = [
    "pyspnego>=0.9.0",
    "pypac>=0.16.0",
    "truststore>=0.10.0; python_version >= '3.10'",
    "httpx>=0.26.0",
    "aiohttp>=3.11.0",
    "websockets>=15.0",
    "grpcio>=1.50.0",
    "selenium>=4.0.0",
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/sanjuant/iziproxy"
"Bug Tracker" = "https://github.com/sanjuant/iziproxy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
