[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "iziproxy"
version = "0.8.0"
description = "Une bibliothèque Python pour la gestion simplifiée des proxys d'entreprise"
readme = "README.md"
authors = [
    {name = "sanjuant"}
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["proxy", "enterprise", "authentication", "ntlm", "requests", "configuration", "development",  "pac"]
# Minimums = plus ancienne version sans faille connue (base OSV, novembre
# 2026) qui fonctionne avec IziProxy, vérifiée par les tests en résolution
# « au plus bas » : une application peut garder des versions plus anciennes
# que les dernières. pip installe tout de même les dernières par défaut.
# Avant ces minimums, requests, urllib3, cryptography et aiohttp ont des
# failles connues, dont des fuites de l'en-tête Proxy-Authorization.
dependencies = [
    "requests>=2.33.0",
    "PyYAML>=6.0.1",
    "keyring>=23.0.0",
    "cryptography>=50.0.0",
    "urllib3>=2.8.0",
    # Autorités du système (Windows, macOS, Linux) : un proxy d'entreprise
    # qui inspecte TLS présente une autorité déployée dans le magasin du
    # système, absente de certifi. install() l'injecte dans ssl.
    "truststore>=0.10.0",
]
# Python 3.10 n'est plus maintenu depuis octobre 2026
requires-python = ">=3.11"

[project.optional-dependencies]
# Avant pyspnego 0.12.4, NTLM échoue sous Windows Server 2025 (constaté sur
# le CI GitHub Actions) ; 0.9.x n'a pas de wheel pour les Python récents
ntlm = [
    "pyspnego>=0.12.4",
]
# pypac 0.16 à 0.18.3 acceptent dukpy 0.6 (QuickJS), avec lequel ils
# n'évaluent plus les PAC ; 0.18.4 exige dukpy < 0.6, 0.19 gère QuickJS
pac = [
    "pypac>=0.18.4",
]
# Conservé pour la compatibilité : truststore est désormais obligatoire
truststore = []
httpx = [
    "httpx>=0.26.0",
]
aiohttp = [
    "aiohttp>=3.14.4",
]
all = [
    "iziproxy[ntlm,pac,truststore]",
]
# Outils de développement : dernières versions compatibles avec Python 3.11
# (Sphinx 9.2 exige Python 3.13 : pip l'installe sur un Python récent)
dev = [
    "iziproxy[all,httpx,aiohttp]",
    "websockets>=17.4",
    "grpcio>=1.85.1",
    "selenium>=4.52.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "flake8>=7.5.0",
    "sphinx>=9.0.4",
    "sphinx-rtd-theme>=3.1.0",
]

[project.scripts]
iziproxy = "iziproxy.cli:main"

[project.urls]
"Homepage" = "https://github.com/sanjuant/iziproxy"
"Bug Tracker" = "https://github.com/sanjuant/iziproxy/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"